<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>تفاصيل الشهادة | إثراء المهني</title>
<style>
:root{--navy:#24224c;--gold:#c7a23a;--ink:#252735;--muted:#6d7080;--line:#e6e7ee;--bg:#f6f7fb;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}a{text-decoration:none;color:inherit}.container{width:min(1100px,calc(100% - 32px));margin:auto}.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.head{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--navy)}.brand img{width:190px;height:60px;object-fit:contain}.nav{display:flex;gap:18px;font-weight:800;font-size:14px}.nav a:hover{color:var(--gold)}.hero{background:linear-gradient(135deg,var(--navy),#34316c);color:#fff;padding:54px 0}.crumb{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:12px}.code{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:999px;font-weight:900}.hero h1{font-size:42px;line-height:1.25;margin:12px 0}.hero p{max-width:800px;margin:0;color:rgba(255,255,255,.82)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.meta span{background:rgba(255,255,255,.1);padding:7px 10px;border-radius:9px;font-size:13px}.main{padding:42px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(36,34,76,.06)}.card.full{grid-column:1/-1}.card h2{font-size:18px;color:var(--navy);margin:0 0 10px}.card p{margin:0;color:var(--muted)}ul{margin:0;padding-right:20px;color:var(--muted)}.providers{margin-top:26px}.providers-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.providers-title h2{margin:0;color:var(--navy)}.providers-title p{margin:0;color:var(--muted);font-size:13px}.provider{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:18px;box-shadow:0 10px 28px rgba(36,34,76,.06)}.provider-logo{width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}.provider h3{margin:0 0 4px}.provider p{margin:0;color:var(--muted);font-size:13px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tags span{background:#f1f1f7;border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:12px}.register{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 17px;font-weight:900;white-space:nowrap}.register:hover{background:#171634}.note{margin-top:12px;color:var(--muted);font-size:12px}.back{display:inline-flex;margin-top:25px;color:var(--navy);font-weight:900}.footer{margin-top:40px;background:var(--navy);color:#fff;text-align:center;padding:22px}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#171634;color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.nav{display:none}.brand img{width:150px}.hero h1{font-size:30px}.grid{grid-template-columns:1fr}.card.full{grid-column:auto}.provider{grid-template-columns:58px 1fr}.provider-logo{width:54px;height:54px}.register{grid-column:1/-1;width:100%}}
</style>
<link href="assets/favicon.svg" rel="icon" type="image/svg+xml"/><link href="assets/theme.css" rel="stylesheet"/></head>
<body>
<header class="header"><div class="container head"><a class="brand ethraa-brand" href="index.html" aria-label="إثراء المهني - الصفحة الرئيسية"><img class="ethraa-brand__icon" src="assets/ethraa-icon.svg" alt=""><span class="ethraa-brand__copy"><strong class="ethraa-brand__name">إثراء المهني</strong><span class="ethraa-brand__tagline">دليل الشهادات الاحترافية</span></span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="results.html">الشهادات</a><a href="platforms.html">المنصات</a></nav></div></header>
<section class="hero"><div class="container" id="heroContent"></div></section>
<main class="main"><div class="container" id="content"></div></main>
<footer class="footer">جميع الحقوق محفوظة © 2026 – إثراء المهني</footer>
<div class="toast" id="toast">سيتم تفعيل رابط التسجيل لدى المركز بعد إضافة الرابط المعتمد.</div>
<script src="certificates-data.js"></script>
<script>
const params=new URLSearchParams(location.search);const code=params.get('code');const c=(window.CERTIFICATES||[]).find(x=>x.code===code);
const hero=document.getElementById('heroContent'),content=document.getElementById('content');
if(!c){hero.innerHTML='<h1>الشهادة غير موجودة</h1>';content.innerHTML='<div class="empty">تعذر العثور على بيانات هذه الشهادة.<br><a class="back" href="results.html">العودة إلى دليل الشهادات</a></div>'}
else{
 document.title=c.title+' | إثراء المهني';
 hero.innerHTML=`<div class="crumb"><a href="index.html">الرئيسية</a> / <a href="results.html">الشهادات</a> / ${c.code}</div><span class="code">${c.code}</span><h1>${c.title}</h1><p>${c.summary}</p><div class="meta"><span>الجهة المانحة: ${c.issuer}</span><span>مدة البرنامج الحالية: ${c.hours} ساعة</span><span>المجال: ${c.field}</span></div>`;
 const requirements=c.code==='PMP'?'خبرة عملية ومتطلبات أهلية تحددها الجهة المانحة، إضافة إلى الساعات التدريبية المطلوبة.':'تختلف المتطلبات بحسب الجهة المانحة والمركز المقدم، ويُنصح بمراجعة شروط التسجيل قبل الدفع.';
 const audience='الطلاب والخريجون والموظفون والمهتمون بتطوير مسارهم المهني في مجال '+c.field+'.';
 const jobs='أدوار وظيفية مقترحة في مجال '+c.field+'، مثل أخصائي أو منسق أو مسؤول أو محلل بحسب مستوى الخبرة والمؤهل.';
 content.innerHTML=`<section class="grid"><article class="card"><h2>تعريف الشهادة</h2><p>${c.summary}</p></article><article class="card"><h2>الجهة المانحة</h2><p>${c.issuer}</p></article><article class="card"><h2>الفئة المستهدفة</h2><p>${audience}</p></article><article class="card"><h2>المتطلبات</h2><p>${requirements}</p></article><article class="card"><h2>مدة التحضير</h2><p>البرنامج المعروض حالياً ${c.hours} ساعة، وقد تختلف مدة الاستعداد الفعلية حسب خبرة المتدرب وخطة المركز.</p></article><article class="card"><h2>المهارات المكتسبة</h2><ul>${c.skills.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="card"><h2>الوظائف المرتبطة</h2><p>${jobs}</p></article><article class="card"><h2>التخصصات المناسبة</h2><ul>${[...c.colleges,...c.majors].map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="card full"><h2>مدى الملاءمة</h2><p>${c.fit}</p></article></section><section class="providers" id="providers"><div class="providers-title"><div><h2>المراكز التي تقدم برنامج التحضير</h2><p>قارن جميع الخيارات واختر المركز بنفسك. لا تختار المنصة مركزاً نيابةً عنك، ولا يتم التحويل لأي جهة إلا بعد ضغط زر التسجيل الخاص بها.</p></div></div><article class="provider"><div class="provider-logo">م</div><div><h3>مركز محترف</h3><p>المركز المتاح حالياً لتقديم برنامج التحضير لهذه الشهادة.</p><div class="tags"><span>السعر: يحدد عند التسجيل</span><span>النمط: عن بُعد</span><span>المدينة: متاح من جميع المناطق</span><span>${c.hours} ساعة</span></div></div><a class="register" href="https://aa6vdd-de.github.io/mohteref/" target="_blank" rel="noopener noreferrer">التسجيل لدى المركز</a></article><p class="note">ستظهر مراكز أخرى هنا عند إضافتها، ويختار المستفيد المركز المناسب له بنفسه.</p></section><a class="back" href="results.html">← العودة إلى جميع الشهادات</a>`;
}
function showNotice(){const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2600)}
</script>
</body></html>
